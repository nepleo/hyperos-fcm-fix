# 签名构建并发布本 fork 的 GitHub Release。
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# 由「上游新 Release 同步成功」自动调用，也可手动 Run workflow。
name: Release APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      upstream_tag:
        description: "跟随的上游 Release tag"
        type: string
        required: false
        default: ""
      notice_issue:
        description: "通知用 Issue 编号"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured — skip release."
            NOTICE_ISSUE="${{ inputs.notice_issue }}"
            if [ -n "${NOTICE_ISSUE:-}" ]; then
              gh issue comment "$NOTICE_ISSUE" --body "上游已同步，但签名 Secrets 未配置，本 fork Release 已跳过。请在仓库 Settings → Secrets 中配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 后手动跑 **Release APK**。"
            fi
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        if: steps.secrets.outputs.ready == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Write keystore
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Sign APK
        if: steps.secrets.outputs.ready == 'true'
        id: sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail

          version_name="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi

          mapfile -t candidates < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "::error::No APK produced under app/build/outputs/apk/release"
            exit 1
          fi
          input="${candidates[0]}"

          build_tools="$(ls -d "${ANDROID_HOME}/build-tools"/* | sort -V | tail -1)"
          out="${RUNNER_TEMP}/FCM-${version_name}-quiet-release.apk"

          "${build_tools}/zipalign" -f -p 4 "$input" "${RUNNER_TEMP}/aligned.apk"
          "${build_tools}/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$out" \
            "${RUNNER_TEMP}/aligned.apk"
          "${build_tools}/apksigner" verify --verbose "$out"

          sha256="$(sha256sum "$out" | awk '{print $1}')"
          bytes="$(wc -c < "$out" | tr -d ' ')"
          tag="v${version_name}"

          echo "apk_path=$out" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$out")" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${UPSTREAM_TAG:-}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.sign.outputs.apk_path }}
          APK_NAME: ${{ steps.sign.outputs.apk_name }}
          SHA256: ${{ steps.sign.outputs.sha256 }}
          BYTES: ${{ steps.sign.outputs.bytes }}
          VERSION_NAME: ${{ steps.sign.outputs.version_name }}
          VERSION_CODE: ${{ steps.sign.outputs.version_code }}
          TAG: ${{ steps.sign.outputs.tag }}
          UPSTREAM_TAG: ${{ steps.sign.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          upstream_line=""
          if [ -n "${UPSTREAM_TAG:-}" ]; then
            upstream_line="- upstream: [\`${UPSTREAM_TAG}\`](https://github.com/dingwen07/hyperos-fcm-fix/releases/tag/${UPSTREAM_TAG})"
          fi

          notes="$(cat <<EOF
          ## FCM 自定义版 ${VERSION_NAME}

          - versionName: \`${VERSION_NAME}\`
          - versionCode: \`${VERSION_CODE}\`
          - APK: \`${APK_NAME}\`
          - size: \`${BYTES}\` bytes
          - sha256: \`${SHA256}\`
          ${upstream_line}

          跟随上游 Release 自动构建签名。
          EOF
          )"
          notes="$(printf '%s\n' "$notes" | sed 's/^          //')"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --notes "$notes"
            release_url="$(gh release view "$TAG" --json url --jq .url)"
          else
            release_url="$(gh release create "$TAG" "$APK_PATH" \
              --title "FCM ${VERSION_NAME}" \
              --notes "$notes")"
          fi

          NOTICE_ISSUE="${{ inputs.notice_issue }}"
          if [ -n "${NOTICE_ISSUE:-}" ]; then
            comment="$(cat <<EOF
          本 fork Release 已发布：[${TAG}](${release_url})
          - APK: \`${APK_NAME}\`
          - sha256: \`${SHA256}\`
          EOF
          )"
            comment="$(printf '%s\n' "$comment" | sed 's/^          //')"
            gh issue comment "$NOTICE_ISSUE" --body "$comment"
          fi
